# The medusa-storefront card: what the console's Blueprints page renders and the
# platform's bootstrap door consumes.
#
# THIS FILE IS NOT THE BUILD. `spec.bootstrap.blueprint` names the build
# document — `repo-blueprint.yaml`, whose phases a runner places. This card is
# what an operator reads and fills in before pressing Build, and
# `testing/manifest.test.sh` compares every list below to the document that
# actually does the thing, not to a copy of itself.
#
# The division of labour with the registry is strict: the registry (orun-cloud
# `infra/baselines-registry/baselines.yaml`) owns identity and listing — id,
# visibility, tier, the pinned tag. This file owns the build contract. Neither
# restates the other, which is why there is no `tag` here: this file is
# fetched AT the tag the registry pins.
apiVersion: orun.io/v1
kind: Blueprint
metadata:
  name: medusa-storefront
  displayName: Medusa Storefront — Medusa's DTC starter storefront on Cloudflare Workers
  description: >
    Medusa's DTC starter storefront as a product of its own: regions and
    countries, the catalogue with collections, categories, search and
    refinements, a cart and a multi-step checkout, customer accounts with
    orders and addresses, Markdown product pages and the Universal Commerce
    Protocol endpoints — built by OpenNext into one Cloudflare Worker with
    Static Assets, with CI that deploys it to stage and prod on merge,
    smoke-tested. It goes live before any Medusa backend is connected, on a
    bundled sample catalogue with a working cart, and reads yours once you
    connect one. One provider, one consent, one landing.
  tags: [storefront, medusa, nextjs, cloudflare]
spec:
  source:
    repo: sourceplane/medusa-storefront
    # No `tag`. The registry pins it; this file is fetched at it.

  # ── What the operator reads first ────────────────────────────────────────
  overview:
    lede: >
      Medusa's storefront on Cloudflare alone. It deploys with a sample
      catalogue and a working cart; give it your Medusa backend's URL and
      publishable key and it sells your products, with checkout and accounts.
    architecture:
      - layer: Edge
        items: [web]
      - layer: Commerce
        items: [Medusa (your backend, connected after the build)]
      - layer: Delivery
        items: [GitHub Actions, OpenNext, wrangler]
    outcome:
      - Live on stage and prod, in one landing
      - A sample catalogue and a working cart until a backend is connected — never a 500
      - Every merge redeploys, smoke-tested on its health route
      - Its own CI from the first commit

  requires:
    # Cloudflare is the only provider connection a bootstrap needs. GitHub
    # arrives as the App installation plus the repo link, not as a
    # connection row. Medusa is NOT a provider the platform brokers: the
    # storefront is built without a backend, and its owner connects one
    # afterwards (the product's README, "Connecting Medusa").
    integrations: [github, cloudflare]
    apiKeyRole: admin          # secret writes need the admin floor

  # Every input is collected by the console: keys are lowercase (the
  # platform's reader refuses anything else), every one carries the `pattern`
  # its value is checked against before Continue, and a value the console
  # already holds says so with `from`. repo-blueprint.yaml declares the same
  # names; `repoPrivate`, `orunWorkspace` and `epicSlug` are build inputs with
  # defaults (or filled from the build's workspace) and are not asked.
  #
  # NOR IS THE DOMAIN. The storefront goes live on workers.dev, and a domain
  # is an owner's step after the bootstrap: `productdomain` defaults to
  # empty, the rebrand writes the reserved placeholder `<reponame>.example.com`
  # where the domain goes, and the store's README ("Custom domain") says how
  # to set it. Nothing that needs a domain is removed — it waits for one.
  inputs:
    - key: reponame
      label: Repo name
      pattern: "^[a-z][a-z0-9-]{1,38}$"
      # The operator picked the repository; its name IS this value.
      from: repo.name
    - key: productname
      label: Store name
      pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'&-]{1,48}$"
      help: The name shoppers see — the navbar, the footer, every page title.
      example: Acme Shop
    - key: githuborg
      label: GitHub organisation
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
      help: The GitHub org or user the store's repository is created under.
      # DERIVED FROM THE CHOSEN REPOSITORY: its owner IS this value. Declared
      # because repo-blueprint.yaml requires it — a build may declare more
      # inputs than this card, but not require one nobody supplies.
      from: repo.owner
    - key: subdomain
      label: workers.dev subdomain
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      help: The workers.dev subdomain of the Cloudflare account the store deploys into.
      example: acme
      # READ FROM THE CLOUDFLARE CONNECTION, not asked. The subdomain belongs
      # to the account the same way its id does, and there is exactly one
      # right answer — a typed one could only be wrong, and wrong showed up
      # after deploy, in the deploy's smoke, 01-product's probes and the
      # verify URL below. The integration reads it from Cloudflare at connect
      # and on its hourly health check; the bootstrap door fills this input
      # from the connection the build is BOUND to, the same one
      # CLOUDFLARE_ACCOUNT_ID and the deploy token mint from, so all three
      # name one account. The console renders no field for it, and an account
      # with no workers.dev subdomain refuses the build at the door, naming
      # the fix, before anything is created.
      from: connection.cloudflare.workersSubdomain

  # ── PREVIEW ONLY. repo-blueprint.yaml's one `orun.integrations/reconcile@v1`
  # hook (`secrets`) mints these, brokered, during 01-product. ──────────────
  # Transcribed from that hook's own `secrets:` list (each key and its
  # template), so testing/manifest.test.sh compares this list to the document
  # that mints them. The console renders them read-only: no credential is ever typed,
  # shown or stored. Keys that already exist are kept. The Medusa backend URL
  # and publishable key (and the payment keys) are not here: no platform
  # connection can mint them, the storefront is built and deployed without
  # them, and its owner adds them afterwards.
  secrets:
    - key: CLOUDFLARE_API_TOKEN
      provider: cloudflare
      template: workers-deploy
      why: Deploys the storefront's Worker and its static assets
    - key: CLOUDFLARE_ACCOUNT_ID
      provider: cloudflare
      template: account-id
      why: Connection fact, not a secret
      fact: true

  # ── PREVIEW ONLY. repo-blueprint.yaml's run-level `hooks.preInstantiate`
  # opens these — the epic, every milestone in this order, every task — before
  # the first phase places. Idempotent by identity, so a re-run finds what it
  # made before.
  programme:
    epicSlug: medusa-storefront-baselining      # = repo-blueprint.yaml's `epicSlug` default
    epicName: "Medusa storefront baselining — {productname}"
    milestones:
      # The whole product is one landing (01-product): the repository, its
      # CI, the storefront and its tests are one pull request and one
      # convergence.
      - name: 01-product
      - name: 02-docs

  bootstrap:
    # THE BUILD DOCUMENT. There is no umbrella workflow and no agent brief:
    # every phase is declared in it and orun runs it.
    blueprint: repo-blueprint.yaml
    # Summed from the phases' expectedMinutes (01-product 11, 02-docs 1). An
    # estimate until a bootstrap on this shape measures it.
    expectedMinutes: 12
    tokenChannel: ORUN_TOKEN_FILE   # how a runner hands over its refreshed token
  # The storefront's URL per environment, as the console links it.
  verify:
    urls:
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev"
    envs: [stage, prod]
