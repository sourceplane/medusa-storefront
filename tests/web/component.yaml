apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-tests
  description: The storefront's vitest suite (the sample Store API and its search, the sample cart through upstream's data layer and server actions, the mode switch, the region middleware and the health route), run with pnpm test
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: tests
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
